<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kozhan Co - Exchange & Remittance Management</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kozhan Co" />
    <meta name="description" content="Professional Currency Exchange & Hawala Remittance Management System" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="alternate icon" href="/pwa-192x192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
        (function() {
            try {
                var stored = localStorage.getItem('kozhan-theme');
                var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.style.colorScheme = 'dark';
                } else {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.style.colorScheme = 'light';
                }
            } catch(e) {}
        })();
    </script>
</head>
<body class="bg-gray-100 dark:bg-slate-950 text-gray-900 dark:text-gray-100 antialiased select-none-touch">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
